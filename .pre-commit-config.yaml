repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python3 -m ruff check src/ --fix --ignore F401
        language: system
        always_run: true
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: python3 -m mypy src/ --strict-equality
        language: system
        always_run: true
        pass_filenames: false
      - id: pylint
        name: pylint
        entry: env PYTHONPATH=. python3 -m pylint src/ --disable=R0801
        language: system
        always_run: true
        pass_filenames: false
